{% include "header.html" %}
<style>
  .table td, .table th {
    vertical-align: middle;
  }
</style>
<div class="container mt-5">
  <div class="row">
    <div class="col">
      <h3>Products</h3>
    </div>
    <div class="col text-end">
      <a class="btn btn-success" style="width: 100px" href="{% url 'add-product' %}">Add</a>
    </div>
  </div>
  <div class="row mt-5">
    <div class="col">
      <table class="table table-striped">
        <thead>
          <tr>
            <th style="width: 10%" class="text-center">#</th>
            <th>Name</th>
            <th>Price</th>
            <th>Category</th>
            <th style="width: 20%">Actions</th>
          </tr>
        </thead>
        <tbody>
          {% for product in products %}
            <tr>
              <td class="text-center">{{ forloop.counter }}</td>
              <td>{{ product.name }}</td>
              <td>{{ product.price }}</td>
              <td>{{ product.category.name }}</td>
              <td>
                <a href="{% url 'edit-product' %}?id={{ product.id }}" class="btn btn-primary">Edit</a>
                <a href="{% url 'delete-product' %}?id={{ product.id }}" class="btn btn-danger">Delete</a>
              </td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% include "footer.html" %}
