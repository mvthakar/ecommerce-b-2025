{% include "header.html" %}
<div class="container">
  <div class="row">
    <div class="col col-lg-4 offset-lg-4 col-md-6 offset-md-3 col-10 offset-1">
      <form action="{% url 'login' %}" method="post">
        {% csrf_token %}
        <div class="card my-5 shadow">
          <div class="card-body">
            <div class="my-3 text-center">
              <h3>Login</h3>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email address</label>
              <input required name="email" placeholder="email@example.com" type="email" class="form-control"
                id="email">
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input required name="password" placeholder="Strong password!" type="password" class="form-control"
                id="password">
            </div>
            <div class="mt-4 text-center d-grid">
              <button class="btn btn-success" type="submit">Submit</button>
            </div>

          </div>
        </div>
      </form>
    </div>
  </div>
  {% if error %}
  <div class="row">
    <div class="col col-lg-4 offset-lg-4 col-md-6 offset-md-3 col-10 offset-1">
      <div class="alert alert-danger alert-dismissible fade show" role="alert">
        {{ error }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
    </div>
  </div>
  {% endif %}
</div>
{% include "footer.html" %}
