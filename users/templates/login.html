<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
</head>

<body>

  <header>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">ECommerce</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
          aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/users/login/">Login</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/users/signup/">Sign up</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>
  <main>
    <div class="container">
      <div class="row">
        <div class="col col-lg-4 offset-lg-4 col-md-6 offset-md-3 col-10 offset-1">
          <form action="/users/login/" method="post">
            {% csrf_token %}
            <div class="card my-5 shadow">
              <div class="card-body">
                <div class="my-3 text-center">
                  <h3>Login</h3>
                </div>
                <div class="mb-3">
                  <label for="email" class="form-label">Email address</label>
                  <input required name="email" placeholder="email@example.com" type="email" class="form-control"
                    id="email">
                </div>
                <div class="mb-3">
                  <label for="password" class="form-label">Password</label>
                  <input required name="password" placeholder="Strong password!" type="password" class="form-control"
                    id="password">
                </div>
                <div class="mt-4 text-center d-grid">
                  <button class="btn btn-success" type="submit">Submit</button>
                </div>

              </div>
            </div>
          </form>
        </div>
      </div>
      {% if error %}
      <div class="row">
        <div class="col col-lg-4 offset-lg-4 col-md-6 offset-md-3 col-10 offset-1">
          <div class="alert alert-danger alert-dismissible fade show" role="alert">
            {{ error }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        </div>
      </div>
      {% endif %}
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
